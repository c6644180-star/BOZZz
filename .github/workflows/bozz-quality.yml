name: BOZZ quality checks

on:
  pull_request:
    branches: [main, feat/gate-1-memory-conversations, feat/gate-1-conversations]
  push:
    branches:
      - feat/gate-1-persistence
      - feat/gate-2-action-approval
      - feat/gate-3-voice-gesture
      - feat/gate-1-memory-conversations
      - feat/gate-1-conversations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bozz-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax, imports and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app tests test_imports.py
      - name: Import API routers
        working-directory: backend
        run: python test_imports.py
      - name: Run backend regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check Electron main-process syntax
        working-directory: frontend
        run: node --check electron/main.cjs
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
      - name: Build frontend
        working-directory: frontend
        run: npm run build
